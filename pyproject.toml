[project]
name = "wikipedia-paragraphs"
version = "1.2.0"
description = "Wikipedia paragraphs for natural language processing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "datasets>=4.6.1",
    "grequests>=0.7.0",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "mwparserfromhell>=0.7.2",
    "requests>=2.32.5",
    "tqdm>=4.67.3",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint.isort]
lines-after-imports = 2
