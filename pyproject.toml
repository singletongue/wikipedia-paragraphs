[project]
name = "wikipedia-paragraphs"
version = "0.1.0"
description = "Wikipedia paragraphs for natural language processing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "datasets>=4.0.0",
    "grequests>=0.7.0",
    "logzero>=1.7.0",
    "lxml>=6.0.0",
    "mwparserfromhell>=0.7.2",
    "requests>=2.32.4",
    "tqdm>=4.67.1",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
skip-magic-trailing-comma = true
