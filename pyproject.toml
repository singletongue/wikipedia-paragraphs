[project]
name = "wikipedia-paragraphs"
version = "0.1.0"
description = "Wikipedia paragraphs for natural language processing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "datasets>=3.2.0",
    "grequests>=0.7.0",
    "logzero>=1.7.0",
    "lxml>=5.3.0",
    "mwparserfromhell>=0.6.6",
    "requests>=2.32.3",
    "tqdm>=4.67.1",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
skip-magic-trailing-comma = true
