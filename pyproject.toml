[project]
name = "wikipedia-paragraphs"
version = "1.3.0"
description = "Wikipedia paragraphs for natural language processing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "datasets>=5.1.0",
    "grequests>=0.7.0",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "mwparserfromhell>=0.7.2",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint.isort]
lines-after-imports = 2
